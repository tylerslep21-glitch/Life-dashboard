<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — Life Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1A1A1A">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 340px;
      background: var(--paper-raised);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      box-shadow: 0 12px 40px var(--shadow);
      text-align: center;
    }
    .login-card h1 { font-size: 1.3rem; margin: 0 0 1.4rem; color: var(--ink); }
    .login-card input[type="password"], .login-card input[type="text"], .login-card input[type="email"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--ink);
      font-size: 1rem;
      margin-bottom: 0.8rem;
      box-sizing: border-box;
    }
    .login-card .btn { width: 100%; margin-bottom: 0.6rem; justify-content: center; }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--muted);
      font-size: 0.75rem;
      margin: 1rem 0;
    }
    .login-divider::before, .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .login-error {
      color: #d84343;
      font-size: 0.85rem;
      margin-top: 0.6rem;
      min-height: 1.2em;
    }
    .login-ok { color: #1a8a4a; font-size: 0.85rem; margin-top: 0.6rem; }
    .login-toggle {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 0.4rem;
      padding: 0.3rem;
      display: block;
      width: 100%;
    }
    .login-legal {
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 1.2rem;
      line-height: 1.5;
    }
    .login-legal a { color: var(--muted); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Life Dashboard</h1>
      <button type="button" class="btn btn-primary" id="touchid-btn" style="display:none;">
        Sign in with Touch ID
      </button>
      <div class="login-divider" id="divider" style="display:none;">or</div>

      <form id="password-form">
        <input type="text" id="username-input" placeholder="Username or email" autocomplete="username" autofocus required>
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-ghost">Sign in</button>
      </form>
      <button type="button" class="login-toggle" id="toggle-forgot" style="margin-top:-0.3rem;">Forgot password?</button>

      <form id="signup-form" style="display:none;">
        <input type="text" id="signup-username-input" placeholder="Choose a username" autocomplete="username" required>
        <input type="email" id="signup-email-input" placeholder="Email" autocomplete="email" required>
        <input type="password" id="signup-password-input" placeholder="Choose a password" autocomplete="new-password" required>
        <input type="text" id="signup-invite-input" placeholder="Invite code" autocomplete="off" required>
        <button type="submit" class="btn btn-ghost">Create account</button>
      </form>

      <form id="forgot-form" style="display:none;">
        <input type="email" id="forgot-email-input" placeholder="Your account email" autocomplete="email" required>
        <button type="submit" class="btn btn-ghost">Send reset link</button>
      </form>

      <button type="button" class="login-toggle" id="toggle-signup">Need an account? Sign up</button>
      <p class="login-error" id="login-error"></p>
      <p class="login-ok" id="login-ok"></p>

      <p class="login-legal">
        By signing in or creating an account you agree to the
        <a href="/terms.html">Terms of Service</a> and <a href="/privacy.html">Privacy Policy</a>.
      </p>
    </div>
  </div>

  <script src="/webauthn.js"></script>
  <script>
    var errorEl = document.getElementById('login-error');
    var okEl = document.getElementById('login-ok');
    var touchIdBtn = document.getElementById('touchid-btn');
    var divider = document.getElementById('divider');
    var loginForm = document.getElementById('password-form');
    var signupForm = document.getElementById('signup-form');
    var forgotForm = document.getElementById('forgot-form');
    var toggleSignupBtn = document.getElementById('toggle-signup');
    var toggleForgotBtn = document.getElementById('toggle-forgot');

    function showForm(which) {
      loginForm.style.display = which === 'login' ? 'block' : 'none';
      signupForm.style.display = which === 'signup' ? 'block' : 'none';
      forgotForm.style.display = which === 'forgot' ? 'block' : 'none';
      toggleSignupBtn.style.display = which === 'forgot' ? 'none' : 'block';
      toggleForgotBtn.style.display = which === 'signup' ? 'none' : 'block';
      toggleSignupBtn.textContent = which === 'signup' ? 'Already have an account? Sign in' : 'Need an account? Sign up';
      toggleForgotBtn.textContent = which === 'forgot' ? 'Back to sign in' : 'Forgot password?';
      errorEl.textContent = '';
      okEl.textContent = '';
    }

    // Only offer Touch ID if this browser supports it AND at least one credential is
    // already registered - probing the options endpoint doubles as that check.
    if (webauthnSupported()) {
      fetch('/api/auth/webauthn/authentication-options', { method: 'GET' })
        .then(function (res) {
          if (res.status === 404) return; // no credentials registered yet - stay hidden
          touchIdBtn.style.display = 'block';
          divider.style.display = 'flex';
        })
        .catch(function () {});
    }

    touchIdBtn.addEventListener('click', function () {
      errorEl.textContent = '';
      signInWithTouchId()
        .then(function () { window.location.href = '/'; })
        .catch(function (err) {
          // A cancelled/failed platform-authenticator prompt shouldn't look like a hard
          // error - the password field is right there as a fallback.
          errorEl.textContent = err.message || 'Touch ID sign-in failed.';
        });
    });

    var currentForm = 'login';
    toggleSignupBtn.addEventListener('click', function () {
      currentForm = currentForm === 'signup' ? 'login' : 'signup';
      showForm(currentForm);
    });
    toggleForgotBtn.addEventListener('click', function () {
      currentForm = currentForm === 'forgot' ? 'login' : 'forgot';
      showForm(currentForm);
    });

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.textContent = '';
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          identifier: document.getElementById('username-input').value,
          password: document.getElementById('password-input').value,
        }),
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (b) { throw new Error(b.error || 'Sign-in failed'); });
          window.location.href = '/';
        })
        .catch(function (err) { errorEl.textContent = err.message; });
    });

    signupForm.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.textContent = '';
      fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('signup-username-input').value,
          email: document.getElementById('signup-email-input').value,
          password: document.getElementById('signup-password-input').value,
          invite_code: document.getElementById('signup-invite-input').value,
        }),
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (b) { throw new Error(b.error || 'Sign-up failed'); });
          window.location.href = '/';
        })
        .catch(function (err) { errorEl.textContent = err.message; });
    });

    forgotForm.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.textContent = '';
      okEl.textContent = '';
      fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('forgot-email-input').value }),
      })
        .then(function () {
          // Deliberately the same message whether or not the email matched an
          // account - confirming/denying an email's existence to an
          // unauthenticated caller is its own small privacy leak.
          okEl.textContent = 'If that email matches an account, a reset link is on its way.';
        })
        .catch(function () { errorEl.textContent = 'Could not send reset link right now.'; });
    });
  </script>
</body>
</html>
