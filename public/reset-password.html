<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset password — Life Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1A1A">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .login-card {
      width: 100%;
      max-width: 340px;
      background: var(--paper-raised);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      box-shadow: 0 12px 40px var(--shadow);
      text-align: center;
    }
    .login-card h1 { font-size: 1.3rem; margin: 0 0 1.4rem; color: var(--ink); }
    .login-card input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--ink);
      font-size: 1rem;
      margin-bottom: 0.8rem;
      box-sizing: border-box;
    }
    .login-card .btn { width: 100%; margin-bottom: 0.6rem; justify-content: center; }
    .login-error { color: #d84343; font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.2em; }
    .login-ok { color: #1a8a4a; font-size: 0.85rem; margin-top: 0.6rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Reset your password</h1>
      <form id="reset-form">
        <input type="password" id="new-password-input" placeholder="New password" autocomplete="new-password" minlength="8" required>
        <input type="password" id="confirm-password-input" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
        <button type="submit" class="btn btn-ghost">Reset password</button>
      </form>
      <p class="login-error" id="reset-error"></p>
      <p class="login-ok" id="reset-ok"></p>
    </div>
  </div>

  <script>
    var token = new URLSearchParams(window.location.search).get('token');
    var form = document.getElementById('reset-form');
    var errorEl = document.getElementById('reset-error');
    var okEl = document.getElementById('reset-ok');

    if (!token) {
      errorEl.textContent = 'Missing or invalid reset link.';
      form.style.display = 'none';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.textContent = '';
      okEl.textContent = '';
      var newPassword = document.getElementById('new-password-input').value;
      var confirmPassword = document.getElementById('confirm-password-input').value;
      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        return;
      }
      fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, new_password: newPassword }),
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (b) { throw new Error(b.error || 'Could not reset password'); });
          okEl.textContent = 'Password updated. Redirecting to sign in…';
          form.style.display = 'none';
          setTimeout(function () { window.location.href = '/login'; }, 1500);
        })
        .catch(function (err) { errorEl.textContent = err.message; });
    });
  </script>
</body>
</html>
